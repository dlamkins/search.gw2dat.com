<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="utf-8" />
        <title>Gw2Dat Texture Search</title>
        <style>
            @import url(https://fonts.googleapis.com/css?family=Lato:400,700,300);
            body {
                font-family: "Lato", sans-serif;
            }

            body {
                padding:0;
                margin:0;
            }

            form {
                background-color: #303846;
                position:static;
                top:0;
                left:0;
                right:0;
                padding:1.5em 2em;
            }

            .file-upload-wrapper {
                position: relative;
                width: 100%;
                height: 60px;
            }

            .file-upload-wrapper:after {
                content: attr(data-text);
                font-size: 18px;
                position: absolute;
                top: 0;
                left: 0;
                background: #fff;
                padding: 10px 15px;
                display: block;
                width: calc(100% - 40px);
                pointer-events: none;
                z-index: 20;
                height: 40px;
                line-height: 40px;
                color: #999;
                border-radius: 5px 10px 10px 5px;
                font-weight: 300;
            }

            .file-upload-wrapper:before {
                content: "Upload";
                position: absolute;
                top: 0;
                right: 0;
                display: inline-block;
                height: 60px;
                background: #4daf7c;
                color: #fff;
                font-weight: 700;
                z-index: 25;
                font-size: 16px;
                line-height: 60px;
                padding: 0 15px;
                text-transform: uppercase;
                pointer-events: none;
                border-radius: 0 5px 5px 0;
            }

            .file-upload-wrapper:hover:before {
                background: #3d8c63;
            }

            .file-upload-wrapper input {
                opacity: 0;
                position: absolute;
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 99;
                height: 40px;
                margin: 0;
                padding: 0;
                display: block;
                cursor: pointer;
                width: 100%;
            }

            #status {
                display: flex;
                align-items: center;
                gap: 1em;
                padding: 1em 2em;
                background-color: #eef1f5;
                color: #303846;
                font-size: 18px;
            }

            #status[hidden], #statusImage[hidden], #statusSpinner[hidden] {
                display: none;
            }

            #statusImage {
                max-width: 96px;
                max-height: 96px;
                border-radius: 5px;
                background-color: #303846;
            }

            #statusSpinner {
                flex: none;
                width: 20px;
                height: 20px;
                border: 3px solid #c5ccd6;
                border-top-color: #4daf7c;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <form id="uploadForm">
            <div class="file-upload-wrapper" data-text="Upload Guild Wars 2 Image or Paste From Clipboard">
                <input type="file" name="image" id="imageUploader" accept="image/*" />
            </div>
            <div style="padding-top:1em;">
                <a target="_blank" style="color:white;text-decoration:none;" href="https://blish-hud.notion.site/blish-hud/Overview-of-search-gw2dat-com-71792757b6f84abd8071dcb9fcfd3d2a">&gt; Read the Docs 📖</a>
            </div>
        </form>
        <div id="status" hidden>
            <img id="statusImage" alt="The image you searched for" hidden />
            <span id="statusSpinner" hidden></span>
            <span id="statusText" role="status"></span>
        </div>
        <div style="padding: 2em;" id="results">
            <center>No results</center>
        </div>
        <script>
            const fileInput     = document.getElementById("imageUploader");
            const resultsEl     = document.getElementById("results");
            const statusEl      = document.getElementById("status");
            const statusImageEl = document.getElementById("statusImage");
            const statusSpinner = document.getElementById("statusSpinner");
            const statusTextEl  = document.getElementById("statusText");
            const worker        = new Worker("search-worker.js");

            const MIN_BUSY_MS = 300; // Searches are quick enough to otherwise look like nothing happened

            const STATUS_MESSAGES = {
                downloading: "Image received. Downloading the search index...",
                searching: "Image received. Searching..."
            };

            const ERROR_MESSAGES = {
                index: "The search index could not be downloaded. Please try again.",
                image: "That file could not be read as an image."
            };

            let latestSearchId = 0;
            let busyUntil = 0;

            function setStatus(message, busy) {
                statusEl.hidden = false;
                statusSpinner.hidden = !busy;
                statusTextEl.textContent = message;
            }

            // The page can update before a cached worker does, and older workers don't send total.
            function showResults(results, total = results.length) {
                if (total === 0) {
                    setStatus("No matches found for this image.", false);
                } else if (total > results.length) {
                    setStatus(`Showing the top ${results.length} of ${total} matches.`, false);
                } else {
                    setStatus(`Found ${total} ${total === 1 ? "match" : "matches"}.`, false);
                }

                resultsEl.replaceChildren(...results.map(({ asset }) => {
                    const link = document.createElement("a");
                    link.target = "_blank";
                    link.href = `https://assets.gw2dat.com/${asset}.png`;

                    const image = document.createElement("img");
                    image.src = link.href;
                    image.title = asset;

                    link.append(image);
                    return link;
                }));
            }

            function startSearch(file) {
                URL.revokeObjectURL(statusImageEl.src);
                statusImageEl.src = URL.createObjectURL(file);
                statusImageEl.hidden = false;

                resultsEl.replaceChildren();
                setStatus(STATUS_MESSAGES.searching, true);
                busyUntil = performance.now() + MIN_BUSY_MS;

                worker.postMessage({ searchId: ++latestSearchId, file });
            }

            statusImageEl.onerror = () => statusImageEl.hidden = true;

            worker.onmessage = ({ data: { searchId, status, results, total, error } }) => {
                if (searchId !== latestSearchId) {
                    return;
                }

                if (status) {
                    setStatus(STATUS_MESSAGES[status], true);
                    return;
                }

                setTimeout(() => {
                    if (searchId !== latestSearchId) {
                        return;
                    }

                    if (error) {
                        setStatus(ERROR_MESSAGES[error] ?? ERROR_MESSAGES.image, false);
                    } else {
                        showResults(results, total);
                    }
                }, busyUntil - performance.now());
            };

            worker.onerror = () => setStatus("Search could not be started.", false);

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    startSearch(fileInput.files[0]);
                    fileInput.value = "";
                }
            });

            window.addEventListener('paste', e => {
                if (e.clipboardData.files.length > 0) {
                    startSearch(e.clipboardData.files[0]);
                }
            });
        </script>
    </body>
</html>
